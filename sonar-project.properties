
sonar.projectKey=Resmeralda_bbj-ios-mobile
sonar.organization=resmeralda
sonar.projectName=BJJ Fitness App
sonar.projectVersion=1.0

# Analyze the repository
sonar.sources=lib
sonar.tests=test
sonar.test.inclusions=test/**/*

# Use UTF-8 encoding
sonar.sourceEncoding=UTF-8

# Exclude generated files and build artifacts
sonar.exclusions=**/build/**,**/.dart_tool/**,**/.git/**,**/Pods/**,**/*.g.dart,**/*.freezed.dart

sonar.dart.lcov.reportPaths=coverage/lcov.info
